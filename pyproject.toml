[project]
name = "fastpiclef"
version = "0.1.0"
description = "Fast Picard-Lefschetz Fresnel-integral / wave-optics lensing solver"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
# Pure-Rust extension (no python source tree); the bindings live behind the
# crate's `python` feature. `module-name` sets the import name independently
# of the Rust crate (whose name carries a legacy typo).
features = ["python"]
module-name = "fastpiclef"

# --- pixi: a build/comparison env (default) and a `notebook` sub-environment
# --- that adds Jupyter on top for running notebooks/getting_started.ipynb.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.activation.env]
# So `maturin develop` works against the env's Python 3.14 (ahead of pyo3 0.24).
PYO3_USE_ABI3_FORWARD_COMPATIBILITY = "1"

[tool.pixi.dependencies]
numpy = ">=2.4.6,<3"
scipy = ">=1.11"
matplotlib = ">=3.8"
maturin = ">=1.7"

# Jupyter tooling lives only in the `notebook` environment.
[tool.pixi.feature.notebook.dependencies]
jupyterlab = ">=4"
ipykernel = ">=6"
nbconvert = ">=7"

# Reference codes for the comparison harness, in the `comparison` environment:
# plind (pypi, PL solver), FIONA's runtime deps (FIONA itself is imported from
# refs/FIONA via sys.path — refs is read-only), and a C++ toolchain to build
# P-LPI. (The earlier geospatial "fiona" conda dep was a red herring and is
# gone; the reference FIONA is the local package refs/FIONA/fiona.)
[tool.pixi.feature.comparison.dependencies]
cxx-compiler = "*"
numexpr = "*"
psutil = "*"
pandas = "*"
# FIONA's fast 2D solver (FresnelNUFFT3) back-end. Its compiled Hankel
# extension (_pynufht) is not shipped in refs/, so we benchmark the NUFFT path.
finufft = "*"
mpmath = "*"
jax = ">=0.10.2,<0.11"
# wolensing's runtime deps (P4; refs/wolensing is imported via sys.path).  Its
# `fast_histogram` is PyPI-only, hence the pypi section below.
lenstronomy = "*"
astropy = "*"
tqdm = "*"

[tool.pixi.feature.comparison.pypi-dependencies]
plind = "*"
fast_histogram = "*"

# GWLENS: the third-party dense-map comparator for the elliptical-NFW
# investigation.  The pinned source is cloned into .pixi/gwlens-src by the
# `gwlens-setup` task; it is not vendored (refs/ is read-only).  The package's
# own metadata pulls the heavy bilby/lalsuite stack, which the solver does not
# import, so only the solver's light runtime deps are installed here.  In the
# `comparison` env GWLENS is still used from a scratch clone via
# `--gwlens-dir`.
[tool.pixi.feature.gwlens.dependencies]
# Only gwlens.solver.solver2d is used.  Its heavy PE/TDF dependencies
# (bilby/lalsuite) are never imported; installing the package from PyPI would
# drag them in (and they do not build here), so the pinned source is cloned by
# the `gwlens-setup` task into .pixi/ (gitignored) and put on PYTHONPATH.
# These are the solver's actual runtime needs.
finufft = "*"
numexpr = "*"
threadpoolctl = "*"
astropy = "*"

[tool.pixi.environments]
default = { solve-group = "main" }
# `notebook` also pulls in `comparison` so notebooks/comparison.ipynb (which
# drives the reference codes) can run in the Jupyter env.
notebook = { features = ["notebook", "comparison"], solve-group = "main" }
comparison = { features = ["comparison"], solve-group = "main" }
gwlens = { features = ["gwlens"], solve-group = "main" }

[tool.pixi.tasks]
# Build/install the extension into the active environment.
build = "maturin develop --release"
test-py = { cmd = "python tests/python/test_wrapper.py && python tests/python/test_stub.py", depends-on = ["build"] }

# Jupyter tasks: scoped to the `notebook` feature (only that env has jupyter),
# so `pixi run lab` / `pixi run notebook-*` auto-select the right environment.
[tool.pixi.feature.notebook.tasks]
lab = { cmd = "jupyter lab", depends-on = ["build"] }
notebook-getting-started = { cmd = "jupyter nbconvert --execute --to notebook --inplace --ExecutePreprocessor.timeout=900 notebooks/getting_started.ipynb", depends-on = [
    "build",
] }
notebook-comparison = { cmd = "jupyter nbconvert --execute --to notebook --inplace --ExecutePreprocessor.timeout=3600 notebooks/comparison.ipynb", depends-on = [
    "build",
] }

# The comparison harness (needs plind); run with `pixi run -e comparison bench`.
[tool.pixi.feature.comparison.tasks]
bench = { cmd = "python -m comparison.run", depends-on = ["build"] }
# P3 evaluation program:
bench-p3 = { cmd = "python -m comparison.convergence", depends-on = ["build"] }
difficult = { cmd = "python -m comparison.difficult_cases", depends-on = ["build"] }
glworia = { cmd = "python -m comparison.glworia_compare", depends-on = ["build"] }
# P4:
high-omega = { cmd = "python -m comparison.high_omega", depends-on = ["build"] }
geo-study = { cmd = "python -m comparison.geometric_high_omega", depends-on = ["build"] }
sp-correction = { cmd = "python -m comparison.sp_correction", depends-on = ["build"] }
hybrid-check = { cmd = "python -m comparison.hybrid_check", depends-on = ["build"] }
wolensing = { cmd = "python -m comparison.wolensing_compare", depends-on = ["build"] }
many-masses = { cmd = "cargo run --release --example many_masses --", depends-on = ["build"] }
many-masses-fold = { cmd = "python -m comparison.many_masses_fold", depends-on = ["build"] }
logistic-bridge = { cmd = "python -m comparison.logistic_bridge", depends-on = ["build"] }
fast-paths = { cmd = "python -m comparison.fast_paths", depends-on = ["build"] }
nd-band = { cmd = "python -m comparison.nd_band", depends-on = ["build"] }
low-omega = { cmd = "python -m comparison.low_omega", depends-on = ["build"] }
plot-bench = { cmd = "python -m comparison.plot_bench", depends-on = ["build"] }
profiles-fiona = { cmd = "python comparison/profiles_fiona_check.py", depends-on = ["build"] }

# The elliptical-NFW + shear prototype in the dedicated GWLENS environment.
[tool.pixi.feature.gwlens.tasks]
# Pin the scratch source (never inside refs/); .pixi/ is gitignored.
gwlens-setup = { cmd = "bash -c 'set -e; if [ ! -d .pixi/gwlens-src/.git ]; then git clone https://github.com/hsreekanth15/GWLENS .pixi/gwlens-src; fi; git -C .pixi/gwlens-src checkout e73167afb84273c1e0f4cb488a1c5a2fc4d7d652'" }
nfw-elliptical = { cmd = "PYTHONPATH=.pixi/gwlens-src python prototypes/nfw_elliptical_shear.py", depends-on = ["build", "gwlens-setup"] }
