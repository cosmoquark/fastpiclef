# The distro rustc (>= 1.96 package) defaults to `clang` for linking, which
# is not installed here; use the GCC driver instead.
[target.x86_64-unknown-linux-gnu]
linker = "cc"

[env]
# The pixi env ships Python 3.14, newer than pyo3 0.24 knows about; the abi3
# (stable ABI) build is forward-compatible, so allow it explicitly.
PYO3_USE_ABI3_FORWARD_COMPATIBILITY = "1"
